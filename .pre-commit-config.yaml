# .pre-commit-config.yaml
# Ensures consistent formatting, linting, type safety, and clean notebooks
# before every commit or PR.

repos:
  # --- 1. General housekeeping ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  # --- 2. Python formatting ---
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=88]

  # --- 3. Import sorting ---
  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
        name: Sort imports
        args: ["--profile", "black", "--filter-files"]

  # --- 4. Linting (static analysis) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1
    hooks:
      - id: ruff
        args: ["--fix"]

  # --- 5. Type checking ---
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        name: Type checking with mypy
        args: ["--ignore-missing-imports", "--show-error-codes", "--strict"]
        additional_dependencies: []
        exclude: "tests/|docs/"

  # --- 6. Security scanning ---
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        name: Security check with Bandit
        args: ["-r", "src", "--skip", "B101"]

  # --- 7. Notebook cleanup (for Jupyter/Colab files) ---
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        name: Strip output from Jupyter notebooks
        files: \.ipynb$
